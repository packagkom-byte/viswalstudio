version: '3.8'

services:
  # n8n workflow automation platform
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-viswalstudio
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows
      - ./n8n/credentials:/home/node/.n8n/credentials
    networks:
      - viswalstudio-network
    depends_on:
      - ollama

  # Ollama AI model server
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-viswalstudio
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - viswalstudio-network

  # React dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: dashboard-viswalstudio
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_N8N_URL=http://localhost:5678
      - REACT_APP_OLLAMA_URL=http://localhost:11434
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    networks:
      - viswalstudio-network
    depends_on:
      - n8n
      - ollama

networks:
  viswalstudio-network:
    driver: bridge

volumes:
  n8n_data:
  ollama_data:
